<div class="row" style="margin-bottom: 10px;">
    <app-top-menu></app-top-menu>
    </div>
        <div>
            <span style="display: flex;text-align: left;margin-left: 5%;margin-right: 5%;border: 1px solid #fec200; border-radius: 10px;width:90% ;">
    <app-left-menu></app-left-menu>
    <span style="width: 80%;">
        <div style="margin-top: 10px;margin-left: 10px;width: 100%;min-width: 100%;">
            <div class="u-margin-bottom-small">
                <h1 class="heading-secondary">
                    Restaurant Setup
                </h1>
            </div>

          <mat-stepper linear #stepper>
            <mat-step [stepControl]="firstFormGroup" [editable]="isEditable">
              <form [formGroup]="firstFormGroup">
                <ng-template matStepLabel>Area Setup</ng-template>
                <mat-form-field>
                  <mat-label>Area Name</mat-label>
                  <input matInput formControlName="firstCtrl" placeholder="Last name, First name" required>
                </mat-form-field>
                <mat-form-field style="padding: 20px;">
                    <mat-label>Area Description</mat-label>
                    <input matInput formControlName="firstCtrl" placeholder="Last name, First name" required>
                  </mat-form-field>
                <div>
                  <button mat-button matStepperNext>Next</button>
                </div>
              </form>
            </mat-step>
            <mat-step [stepControl]="secondFormGroup" [editable]="isEditable">
              <form [formGroup]="secondFormGroup">
                <ng-template matStepLabel>Table Setup</ng-template>
                <mat-form-field>
                  <mat-label>Address</mat-label>
                  <input matInput formControlName="secondCtrl" placeholder="Ex. 1 Main St, New York, NY"
                         required>
                </mat-form-field>
                <div>
                  <button mat-button matStepperPrevious>Back</button>
                  <button mat-button matStepperNext>Next</button>
                </div>
              </form>
            </mat-step>
            <mat-step>
              <ng-template matStepLabel>QR Setup</ng-template>
              <p>You are now done.</p>
              <div>
                <button mat-button matStepperPrevious>Back</button>
                <button mat-button (click)="stepper.reset()">Reset</button>
              </div>
            </mat-step>
          </mat-stepper>
          


        

        </div>
        </span>
            </span>
            </div>
