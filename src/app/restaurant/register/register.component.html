<body>
	<div class="container-fluid">
		<div class="col-lg-6 col-md-6 col-sm-6 col-xs-12">
			<div class="boxDiv" style="margin-top:52%;">
				<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" style="padding: 0px;">
					<h3 class="pontsHead">Register in 4 Easy Steps!</h3>
				</div>
				<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" style="margin-top: 22px;">
					<img src="./images/Points1.png" alt="points" class="pointsImg">
					<p class="pointsPara">Enter your business details and create your account.</p>
				</div>
				<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
					<img src="./images/Points2.png" alt="points" class="pointsImg">
					<p class="pointsPara">Verify your account via our confirmation email.</p>
				</div>
				<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
					<img src="./images/Points3.png" alt="points" class="pointsImg">
					<p class="pointsPara">Sign in to access your personalized dashbord.</p>
				</div>
				<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
					<img src="./images/Points4.png" alt="points" class="pointsImg">
					<p class="pointsPara">Manage guest requests effortlessly from your dashboard.</p>
				</div>
				<div class="clearfix"></div>
			</div>
		</div>

		<div class="col-lg-6 col-md-6 col-sm-6 col-xs-12">
			<div class="boxDiv" style="margin-top:5%;">
				<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 centerItem" style="padding:0px;">
					<img src="./images/Table Signals_Alerts-01.png" alt="points" style="max-height: 120px;margin-top: 15px;">
					<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" style="padding: 0px;">
						<h3 class="RegisterHead">Restaurant sign up</h3>
					</div>
				</div>
				<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" style="margin-top:25px;width:90%; margin-left: 5%;">
					<form>
						<div class="form-group">
							<input type="text" class="form-control" name="RestaurantName" id="RestaurantName" placeholder="Restaurant Name">
						</div>
						<div class="form-group">
							<input type="text" class="form-control" name="emailid" id="emailid" placeholder="Email ID">
						</div>
						<div class="form-group">
							<input type="password" class="form-control" name="password" id="password" placeholder="Password">
						</div>
						<div class="form-group">
							<input type="text" class="form-control" name="website" id="website" placeholder="Website">
						</div>
						<div class="form-group">
							<input type="text" class="form-control" name="phoneNo" id="phoneNo" placeholder="Phone No.">
						</div>
						<div class="form-group">
							<input type="text" class="form-control" name="address" id="address" placeholder="Address">
						</div>
						<div class="form-group">
							<input type="text" class="form-control" name="city" id="city" placeholder="City">
						</div>
						<div class="form-group">
							<input type="text" class="form-control" name="zipcode" id="zipcode" placeholder="Zip Code">
						</div>
						<div class="form-group">
							<select class="form-control" name="state" id="state" placeholder="State">
								<option>State</option>
							</select>
						</div>
						<div class="form-group">
							<select class="form-control" name="country" id="country" placeholder="Country">
								<option>Country</option>
							</select>
						</div>
						<div class="form-group centerItem">
							<button class="btn btn-default">Create Account</button>
							<button class="btn btn-default">Cancel</button>
						</div>
					</form>
				</div>
				<div class="clearfix"></div>
			</div>
		</div>
	</div>
</body>
